image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/metadao.png
name: MetaDAO
description: >-
  MetaDAO is a fundraising and governance platform for high-quality founders and
  their communities, built on the Solana Futarchy protocol. It runs early fair
  token launches (high-float ICOs) and market-driven ("futarchy") governance
  where decision markets control treasury and intellectual property, with
  performance-aligned insider token unlocks. For developers, MetaDAO operates the
  public Futarchy DEX API — a CoinGecko-compatible, read-only market-data API at
  market-api.metadao.fi that automatically discovers every DAO on the protocol
  and exposes real-time pricing, trading volume, liquidity, and token supply.
  Surfaced as a Paradigm portfolio company and enriched by the API Evangelist
  pipeline from MetaDAO's own published documentation.
